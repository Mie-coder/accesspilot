[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "accesspilot-api"
version = "0.1.0"
description = "AccessPilot demo API and domain model"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "httpx2>=2.5,<3",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<6",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["apps/api/src/accesspilot"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["apps/api/tests"]
pythonpath = ["apps/api/src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["apps/api/src", "apps/api/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["apps/api/src"]
